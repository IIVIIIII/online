<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spring Sketches</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #F5F5F5;
      color: #111;
      font-family: Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── NAV ── */
    .nav {
      padding: 26px 48px;
      border-bottom: 1px solid #d9d9d9;
      flex-shrink: 0;
    }

    .nav a {
      color: #444;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    .nav a:hover { color: #111; }

    /* ── MAIN CONTENT ── */
    .content {
      display: grid;
      grid-template-columns: 8fr 9fr;
      grid-template-rows: 1fr;
      gap: 0;
      flex: 1;
      min-height: 0;
      padding: 0 46px 0;
    }

    /* Divider closing off the vertical rule. No fill or label — these
       pages have nothing below the fold. */
    .screen-rule {
      flex-shrink: 0;
      /* Spacer only — no horizontal rule, since there's nothing below the
         fold here. Holds the bottom gap .content gave up. */
      height: 54px;
      position: relative;
    }

    /* Carries the column divider down to the bottom of the page. Drawn
       here rather than extending .slideshow's border, because .slideshow
       has overflow:hidden and would clip anything below it. Nothing moves.
       x = .content's 46px left padding + the 8fr column, less the 1px rule. */
    .screen-rule::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: calc(46px + (100% - 92px) * 8 / 17 - 1px);
      width: 1px;
      background: #d9d9d9;
    }

    /* ── SLIDESHOW ── */
    .slideshow {
      /* Nudges the dots + counter + buttons group as a unit, keeping the
         button tops flush with the dots. Raise to move it further down. */
      --group-shift: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      /* 45 + 1px border = 46px, matching .content's left padding, so the
         video centres between the window edge and the divider. */
      padding-right: 45px;
      border-right: 1px solid #d9d9d9;
      padding-top: 52px;
      /* Lifts the column's bottom edge; the video (flex: 1) absorbs it. */
      padding-bottom: 10px;
      min-height: 0;
      overflow: hidden;
    }

    /* Portrait-only title (above video) */
    .title-portrait {
      display: none;
    }

    .video-container {
      position: relative;
      background: transparent;
      flex: 1;
      min-height: 0;
      max-width: 100%;
      aspect-ratio: 1 / 1;
    }

    .video-container video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .slide-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      /* Lifts the counter AND buttons together. With the button's own -9px,
         the button top lands flush with the top of the dots. */
      transform: translateY(calc(-16px + var(--group-shift)));
    }

    .slide-btn {
      background: none;
      border: 1px solid #888;
      color: #111;
      padding: 8px 20px;
      cursor: pointer;
      font-size: 12px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-family: Arial, sans-serif;
      transition: border-color 0.2s;
      /* Button ~32px tall vs the counter's ~14px line box; centred together
         it hangs ~9px lower. Lift so the bottom edges meet. */
      transform: translateY(-9px);
    }

    .slide-btn:hover:not(:disabled) { border-color: #111; }
    .slide-btn:disabled { opacity: 0.2; cursor: default; }

    .slide-counter {
      font-size: 12px;
      letter-spacing: 0.15em;
      color: #555;
    }

    .slide-dots {
      display: flex;
      gap: 6px;
      justify-content: center;
      transform: translateY(var(--group-shift));
    }

    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #999;
      cursor: pointer;
      transition: background 0.2s;
    }

    .dot.active { background: #111; }

    /* ── CAPTION PANEL ── */
    .caption-panel {
      --side: 72px;         /* width: lower to widen, raise to narrow */
      --shift: 30px;        /* nudge the whole block right, width unchanged */
      --caption-w: 600px;   /* text column cap */
      --sb-w: 6px;          /* scrollbar width */
      --text-pad: 24px;     /* gap between text and scrollbar */
      padding: 62px calc(var(--side) - var(--shift)) 58px calc(var(--side) + var(--shift));
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    /* Scrollable caption area */
    .caption-scroll-wrap {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    .caption-scroll {
      height: 100%;
      overflow-y: auto;
      padding: 48px var(--text-pad) 48px 0;
      max-width: var(--caption-w);
      margin-inline: auto;
      display: flex;
      flex-direction: column;
    }

    /* Firefox only. These must NOT apply in Chrome: since v121 a non-auto
       scrollbar-width/color disables ::-webkit-scrollbar entirely, which
       hands the scrollbar back to macOS auto-hiding. */
    @supports not selector(::-webkit-scrollbar) {
      .caption-scroll {
        scrollbar-width: thin;
        scrollbar-color: #a8a8a8 #e4e4e4;
      }
    }

    /* Always-visible scrollbar: styling ::-webkit-scrollbar opts out of
       macOS overlay scrollbars, so the track and thumb stay on screen. */
    .caption-scroll::-webkit-scrollbar {
      -webkit-appearance: none;
      width: var(--sb-w);
    }

    .caption-scroll::-webkit-scrollbar-track {
      background: #e4e4e4;
      border-radius: 3px;
    }

    .caption-scroll::-webkit-scrollbar-thumb {
      background: #a8a8a8;
      border-radius: 3px;
    }

    .caption-scroll::-webkit-scrollbar-thumb:hover {
      background: #8a8a8a;
    }


    /* Title + caption centered together */
    .caption-content {
      margin-top: auto;
      margin-bottom: auto;
    }

    .caption-content .piece-title {
      font-size: 32px;
      font-style: italic;
      line-height: 1.25;
      margin-bottom: 10px;
    }

    .caption-content .piece-year {
      font-size: 12px;
      letter-spacing: 0.2em;
      color: #555;
      margin-bottom: 36px;
    }

    /* Fade-out indicator */
    .scroll-fade {
      position: absolute;
      bottom: 0;
      /* Track .caption-scroll: same width (less the scrollbar) and the same
         left offset, so the fade never covers the thumb. */
      left: calc((100% - min(var(--caption-w), 100%)) / 2);
      width: calc(min(var(--caption-w), 100%) - var(--sb-w) - 4px);
      height: 80px;
      background: linear-gradient(to bottom, transparent, #F5F5F5);
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .scroll-fade.hidden { opacity: 0; }

    .caption-text {
      font-family: Menlo, Monaco, 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.85;
      color: #111;
    }

    .caption-text a {
      color: #333;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .caption-text a:hover { color: #111; }

    /* ── PORTRAIT ── */
    @media (orientation: portrait) {
      body {
        height: auto;
        overflow: auto;
      }

      .nav { padding: 20px 24px; }

      .content {
        display: flex;
        flex-direction: column;
        padding: 0 24px 48px;
        min-height: unset;
      }

      .slideshow {
        flex: none;
        min-height: unset;
        overflow: visible;
        padding-right: 0;
        padding-top: 28px;
        padding-bottom: 24px;
        gap: 14px;
        border-right: none;
        border-bottom: 1px solid #d9d9d9;
      }

      .video-container {
        flex: none;
        width: 100%;
        max-width: 100%;
      }

      .title-portrait {
        display: block;
        flex-shrink: 0;
        width: 100%;
        margin-bottom: 12px;
      }

      .title-portrait .piece-title {
        font-size: 30px;
        font-style: italic;
        line-height: 1.2;
        margin-bottom: 6px;
      }

      .title-portrait .piece-year {
        font-size: 12px;
        letter-spacing: 0.2em;
        color: #555;
      }

      .caption-panel {
        flex: none;
        min-height: unset;
        padding: 32px 0 0;
      }

      .title-landscape { display: none; }

      .caption-scroll-wrap {
        position: static;
        overflow: visible;
      }

      .caption-scroll {
        height: auto;
        overflow-y: visible;
        padding: 0;
        max-width: 100%;
        display: block;
      }

      .caption-content {
        margin-top: 0;
        margin-bottom: 0;
      }

      .scroll-fade { display: none; }

      /* no column divider in the stacked layout */
      .screen-rule::before { display: none; }
    }
  </style>
</head>
<body>

  <nav class="nav">
    <a href="index.html#works">&#8592; Works</a>
  </nav>

  <main class="content">

    <section class="slideshow">

      <div class="title-portrait">
        <h1 class="piece-title">Spring Sketches</h1>
        <div class="piece-year">2025</div>
      </div>

      <div class="video-container">
        <video id="mainVideo" controls autoplay muted loop playsinline>
          <source src="https://res.cloudinary.com/aki2q6sp/video/upload/v1791832380/spring1_dawhwv.mp4" type="video/mp4">
        </video>
      </div>

    </section>

    <aside class="caption-panel">

      <!-- Scrollable: title + caption, centered together in landscape -->
      <div class="caption-scroll-wrap">
        <div class="caption-scroll" id="captionScroll">
          <div class="caption-content">
            <div class="title-landscape">
              <h1 class="piece-title">Spring Sketches</h1>
              <div class="piece-year">2025</div>
            </div>
            <p class="caption-text">
              Because I made them in spring, not because they&#8217;re about spring.
            </p>
          </div>
        </div>
        <div class="scroll-fade" id="scrollFade"></div>
      </div>

    </aside>

  </main>

  <div class="screen-rule"></div>

  <script>
    // Single video: no slideshow controls, just keep the frame on-ratio.
    const video = document.getElementById('mainVideo');
    const videoContainer = document.querySelector('.video-container');

    function updateAspectRatio() {
      if (video.videoWidth && video.videoHeight) {
        videoContainer.style.aspectRatio = `${video.videoWidth} / ${video.videoHeight}`;
      }
    }

    video.addEventListener('loadedmetadata', updateAspectRatio);
    if (video.readyState >= 1) updateAspectRatio();

    // Caption scroll fade
    const captionScroll = document.getElementById('captionScroll');
    const scrollFade = document.getElementById('scrollFade');

    function checkFade() {
      const atBottom = captionScroll.scrollHeight - captionScroll.scrollTop <= captionScroll.clientHeight + 2;
      scrollFade.classList.toggle('hidden', atBottom);
    }

    captionScroll.addEventListener('scroll', checkFade);
    window.addEventListener('resize', checkFade);
    setTimeout(checkFade, 50);
  </script>
</body>
</html>
